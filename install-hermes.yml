name: install-hermes
on: push
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash > install.log 2>&1 || true
          { echo '## install report'; echo '---tail---'; tail -5 install.log; echo '---which---'; which hermes; echo '---version---'; hermes --version | head -1; echo END; } > report.md
          git config user.email brianzhangboyang@gmail.com
          git config user.name fleet-bot
          git add report.md
          git commit -m "install report [skip ci]"
          git push
